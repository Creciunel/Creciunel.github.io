name: Deploy Hugo site to Pages

on:
  push:
    branches: ["hugo"] # Am pus 'hugo' pentru că ai zis că acesta e branch-ul tău principal
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: academic-cv # <--- Îi spunem să execute toate comenzile aici

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.153.0
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # <--- Scapi de Warning-ul galben
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Sau '22'

      - name: Install Tailwind CSS
        # Instalăm Tailwind global în mediul de build pentru ca Hugo să îl poată apela
        run: npm install -g tailwindcss

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build with Hugo
        run: hugo --gc --minify
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Important: Artifact-ul se află acum în academic-cv/public
          path: ./academic-cv/public 

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
