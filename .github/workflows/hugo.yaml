name: Deploy Hugo site to Pages

on:
  push:
    branches: ["hugo"] # Am pus 'hugo' pentru că ai zis că acesta e branch-ul tău principal
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: academic-cv # <--- Îi spunem să execute toate comenzile aici

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.160.0 # <--- MODIFICĂ AICI (de la 0.153.0 la 0.160.0)
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'academic-cv/package.json'

      - name: Install Dependencies
        working-directory: academic-cv
        run: |
          npm install -D tailwindcss postcss autoprefixer
          npm install

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.160.0' # <--- MODIFICĂ ȘI AICI (de la '0.153.0' la '0.160.0')
          extended: true

      - name: Build with Hugo
        working-directory: academic-cv
        run: |
          npm install -g pnpm
          pnpm install --no-frozen-lockfile
          pnpm run build 
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./academic-cv/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
