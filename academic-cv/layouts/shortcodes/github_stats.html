<div class="font-mono text-[13px] p-5 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 shadow-md max-w-2xl mx-auto my-6">
    <div class="flex items-center gap-2 mb-4 border-b border-slate-200 dark:border-slate-800 pb-2">
        <div class="flex gap-1.5">
            <div class="w-3 h-3 rounded-full bg-red-400/80"></div>
            <div class="w-3 h-3 rounded-full bg-yellow-400/80"></div>
            <div class="w-3 h-3 rounded-full bg-green-400/80"></div>
        </div>
        <span class="text-slate-400 dark:text-slate-500 text-[10px] ml-2 tracking-widest uppercase">system-monitor.sh</span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 text-slate-800 dark:text-slate-300">
        <div class="space-y-1">
            <div class="flex items-center gap-2 mb-2">
                <span class="text-blue-600 dark:text-blue-400 font-bold animate-pulse">●</span>
                <span class="font-bold text-slate-900 dark:text-white uppercase tracking-wider text-[11px]">User: Creciunel</span>
            </div>
            <div class="pl-4 border-l-2 border-blue-600/20">
                <div><span class="text-slate-500 italic">repos:</span> <span id="t-repos" class="font-bold text-blue-600 dark:text-blue-400">..</span></div>
                <div><span class="text-slate-500 italic">followers:</span> <span id="t-follow" class="font-bold text-blue-600 dark:text-blue-400">..</span></div>
            </div>
        </div>
        
        <div class="space-y-1">
            <div class="flex items-center gap-2 mb-2">
                <span class="text-purple-600 dark:text-purple-400 font-bold">●</span>
                <span class="font-bold text-slate-900 dark:text-white uppercase tracking-wider text-[11px]">Org: NCMST</span>
            </div>
            <div class="pl-4 border-l-2 border-purple-600/20">
                <div><span class="text-slate-500 italic">projects:</span> <span id="n-repos" class="font-bold text-purple-600 dark:text-purple-400">..</span></div>
                <div><span class="text-slate-500 italic">status:</span> <span class="text-purple-600 dark:text-purple-500 font-semibold uppercase text-[10px]">linked</span></div>
            </div>
        </div>
    </div>

    <div class="mt-6 p-3 bg-slate-200/30 dark:bg-black/20 rounded border border-slate-200 dark:border-slate-800 min-h-[60px]">
        <div class="text-[10px] text-slate-500 mb-2 uppercase tracking-widest font-bold">Recent System Activity:</div>
        <div id="gh-log" class="text-green-700 dark:text-green-400 leading-relaxed min-h-[1.5em]">
            <span id="spinner">[/]</span> Initializing...
        </div>
    </div>
    
    <div class="mt-4 pt-3 border-t border-slate-200 dark:border-slate-800 text-[11px] text-slate-400 italic flex justify-between">
        <span>crc@embedded:~$ tail -f /dev/github/events</span>
        <span id="local-time" class="font-normal opacity-70"></span>
    </div>
</div>

<script>
(function() {
    function updateTime() {
        const now = new Date();
        document.getElementById('local-time').innerText = now.toLocaleTimeString('de-DE', {hour: '2-digit', minute:'2-digit', second:'2-digit'});
    }
    setInterval(updateTime, 1000);
    updateTime();

    const spinnerChars = ["[/]", "[-]", "[\\]", "[|]"];
    let spinIdx = 0;
    const spinInterval = setInterval(() => {
        const s = document.getElementById('spinner');
        if (s) s.innerText = spinnerChars[spinIdx++ % spinnerChars.length];
    }, 150);

    function typeWriter(text, elementId) {
        let i = 0;
        const speed = 25; 
        const container = document.getElementById(elementId);
        container.innerHTML = "";
        function type() {
            if (i < text.length) {
                container.innerHTML += text.charAt(i);
                i++;
                setTimeout(type, speed);
            }
        }
        type();
    }

    async function fetchData() {
    const logElement = document.getElementById('gh-log');
    try {
        const [userRes, orgRes, eventRes] = await Promise.all([
            fetch('https://api.github.com/users/Creciunel'),
            fetch('https://api.github.com/users/NCMST'),
            fetch('https://api.github.com/users/Creciunel/events/public')
        ]);

        clearInterval(spinInterval);
        if (userRes.status === 403) { logElement.innerText = ">> System: Rate Limit Exceeded."; return; }

        const userData = await userRes.json();
        const orgData = await orgRes.json();
        const events = await eventRes.json();

        document.getElementById('t-repos').innerText = userData.public_repos || 0;
        document.getElementById('t-follow').innerText = userData.followers || 0;
        document.getElementById('n-repos').innerText = orgData.public_repos || 0;

        const lastPush = events.find(e => e.type === 'PushEvent');

        if (lastPush) {
            const repoName = lastPush.repo.name; // Numele complet: "User/Repo"
            let commitMessage = "";

            // Pasul 1: Încercăm să luăm mesajul direct dacă există
            if (lastPush.payload.commits && lastPush.payload.commits.length > 0) {
                commitMessage = lastPush.payload.commits[0].message;
            } 
            // Pasul 2: Dacă lipsește (cazul tău), facem un fetch rapid pe hash-ul respectiv
            else {
                const commitHash = lastPush.payload.head;
                try {
                    const commitRes = await fetch(`https://api.github.com/repos/${repoName}/commits/${commitHash}`);
                    const commitData = await commitRes.json();
                    commitMessage = commitData.commit.message;
                } catch (err) {
                    commitMessage = "Updated " + lastPush.payload.ref.replace('refs/heads/', '');
                }
            }

            // Curățăm mesajul dacă e prea lung (pentru design)
            const cleanMsg = commitMessage.split('\n')[0].substring(0, 50);
            const displayRepo = repoName.split('/')[1];
            
            typeWriter(`>> [${displayRepo}] last_commit: "${cleanMsg}"`, 'gh-log');
        } else {
            typeWriter(">> No public activity detected.", 'gh-log');
        }
    } catch (e) { 
        clearInterval(spinInterval);
        logElement.innerText = ">> ERROR: Stream synchronization failed.";
    }
}
    fetchData();
})();
</script>
