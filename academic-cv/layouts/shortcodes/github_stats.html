<div class="font-mono text-[13px] p-5 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 shadow-md max-w-2xl mx-auto my-6">
    <div class="flex items-center gap-2 mb-4 border-b border-slate-200 dark:border-slate-800 pb-2">
        <div class="flex gap-1.5">
            <div class="w-3 h-3 rounded-full bg-red-400/80"></div>
            <div class="w-3 h-3 rounded-full bg-yellow-400/80"></div>
            <div class="w-3 h-3 rounded-full bg-green-400/80"></div>
        </div>
        <span class="text-slate-400 dark:text-slate-500 text-xs ml-2">bash — git-status</span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 text-slate-800 dark:text-slate-300">
        <div class="space-y-1">
            <div class="flex items-center gap-2 mb-2">
                <span class="text-blue-600 dark:text-blue-400 font-bold">●</span>
                <span class="font-bold text-slate-900 dark:text-white uppercase tracking-wider text-[11px]">User: Creciunel</span>
            </div>
            <div class="pl-4 border-l-2 border-blue-600/20">
                <div><span class="text-slate-500 italic">repos:</span> <span id="t-repos" class="font-bold text-blue-600 dark:text-blue-400">-</span></div>
                <div><span class="text-slate-500 italic">followers:</span> <span id="t-follow" class="font-bold text-blue-600 dark:text-blue-400">-</span></div>
            </div>
        </div>
        
        <div class="space-y-1">
            <div class="flex items-center gap-2 mb-2">
                <span class="text-purple-600 dark:text-purple-400 font-bold">●</span>
                <span class="font-bold text-slate-900 dark:text-white uppercase tracking-wider text-[11px]">Org: NCMST</span>
            </div>
            <div class="pl-4 border-l-2 border-purple-600/20">
                <div><span class="text-slate-500 italic">projects:</span> <span id="n-repos" class="font-bold text-purple-600 dark:text-purple-400">-</span></div>
                <div><span class="text-slate-500 italic">status:</span> <span class="text-purple-600 dark:text-purple-500 font-semibold uppercase text-[10px]">connected</span></div>
            </div>
        </div>
    </div>

    <div class="mt-6 p-3 bg-slate-200/50 dark:bg-black/20 rounded border border-slate-200 dark:border-slate-800">
        <div class="text-[10px] text-slate-500 mb-2 uppercase tracking-widest font-bold">Recent System Activity:</div>
        <div id="gh-log" class="text-green-700 dark:text-green-400 leading-relaxed">
            <span class="animate-pulse">>> Initializing connection...</span>
        </div>
    </div>
    
    <div class="mt-4 pt-3 border-t border-slate-200 dark:border-slate-800 text-[11px] text-slate-400 italic flex justify-between">
        <span>crc@embedded:~$ tail -n 1 /var/log/git/events</span>
        <span id="local-time" class="font-normal"></span>
    </div>
</div>

<script>
(function() {
    // Ora locală din Germania (pentru contextul tău din Brigachtal)
    function updateTime() {
        const now = new Date();
        document.getElementById('local-time').innerText = now.toLocaleTimeString('de-DE', {hour: '2-digit', minute:'2-digit'});
    }
    setInterval(updateTime, 1000);
    updateTime();

    async function fetchData() {
        try {
            // Stats pentru Creciunel
            const userRes = await fetch('https://api.github.com/users/Creciunel');
            const userData = await userRes.json();
            document.getElementById('t-repos').innerText = userData.public_repos;
            document.getElementById('t-follow').innerText = userData.followers;

            // Stats pentru NCMST
            const orgRes = await fetch('https://api.github.com/users/NCMST');
            const orgData = await orgRes.json();
            document.getElementById('n-repos').innerText = orgData.public_repos;

            // Ultimul commit (Events)
            const eventRes = await fetch('https://api.github.com/users/Creciunel/events/public');
            const events = await eventRes.json();
            
            // Căutăm primul PushEvent (care are commit message)
            const lastPush = events.find(e => e.type === 'PushEvent');
            if (lastPush) {
                const repoName = lastPush.repo.name.split('/')[1];
                const message = lastPush.payload.commits[0].message;
                document.getElementById('gh-log').innerHTML = `
                    <span class="text-blue-500 dark:text-blue-300">[${repoName}]</span> 
                    <span class="text-slate-700 dark:text-slate-200">commit: "${message}"</span>
                `;
            } else {
                document.getElementById('gh-log').innerText = ">> No recent push events detected.";
            }
        } catch (e) { 
            console.error(e);
            document.getElementById('gh-log').innerText = ">> Error: Connection timed out.";
        }
    }
    fetchData();
})();
</script>
