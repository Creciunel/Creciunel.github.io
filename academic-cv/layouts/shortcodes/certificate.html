<div class="cert-item-container">
  <div class="cert-timeline-dot {{ if eq (.Get "type") "education" }}dot-green{{ end }}">
    <i class="fas {{ if .Get "icon" }}{{ .Get "icon" }}{{ else }}fa-certificate{{ end }}"></i>
  </div>
  
  <a href="{{ .Get "link" }}" target="_blank" class="cert-timeline-card">
    <div class="cert-logo-box">
      <img src="{{ .Get "logo" }}" alt="Logo" loading="lazy">
    </div>
    
    <div class="cert-main-info">
      <h3 class="cert-item-title">{{ .Get "title" }}</h3>
      <p class="cert-item-org">{{ .Get "org" }}</p>
      <div class="cert-item-meta">
        <span><i class="far fa-calendar-alt"></i> {{ .Get "date" }}</span>
        {{ if and (.Get "id") (ne (.Get "id") "#") }}
        <span class="cert-id-badge">ID: {{ .Get "id" }}</span>
        {{ end }}
      </div>
    </div>

    <div class="cert-verify-btn">
      {{ if .Get "button_text" }}{{ .Get "button_text" }}{{ else }}Verify ↗{{ end }}
    </div>
  </a>
</div>

<style>
  @import url('https://use.fontawesome.com/releases/v6.0.0/css/all.css');

  .cert-item-container {
    position: relative;
    padding-left: 3.5rem;
    width: 100%;
    display: flex;
    align-items: center; /* Aliniază bulina la mijlocul vertical al cardului */
    margin-bottom: 1.5rem;
  }

  /* Linia verticală - culoarea identică cu cercul (Albastru Hugo) */
  .cert-item-container::before {
    content: "";
    position: absolute;
    left: 1.15rem;
    top: -1rem;
    bottom: -1.5rem;
    width: 2px;
    background-color: #3182ce; /* Culoare exactă ca cercul */
    opacity: 0.3; /* O facem ușor transparentă pentru a nu fi prea stridentă */
    z-index: 1;
  }

  /* Bulina: Fără fundal, doar border și iconiță */
  .cert-timeline-dot {
    position: absolute;
    left: 0.25rem;
    width: 1.85rem;
    height: 1.85rem;
    border-radius: 50%;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: transparent !important; /* Eliminăm orice fundal */
    border: 2px solid #3182ce;
    transition: all 0.3s ease;
  }

  .cert-timeline-dot i {
    font-size: 0.85rem;
    color: #3182ce;
  }

  /* Animația Pulse la hover pe întreg containerul */
  .cert-item-container:hover .cert-timeline-dot {
    box-shadow: 0 0 0 0 rgba(49, 130, 206, 0.6);
    animation: cert-pulse 1.5s infinite cubic-bezier(0.66, 0, 0, 1);
  }

  @keyframes cert-pulse {
    to { box-shadow: 0 0 0 1rem rgba(49, 130, 206, 0); }
  }

  /* Cardul cu border sur */
  .cert-timeline-card {
    text-decoration: none !important;
    background: transparent;
    border: 1px solid rgba(128, 128, 128, 0.25);
    border-radius: 6px;
    padding: 1.25rem;
    display: flex;
    gap: 1.5rem;
    align-items: center;
    transition: all 0.2s ease-in-out;
    width: 100%;
    box-sizing: border-box;
  }

  .cert-timeline-card:hover {
    background: rgba(49, 130, 206, 0.03);
    border-color: #3182ce;
    transform: translateX(5px);
  }

  .cert-logo-box {
    flex-shrink: 0;
    width: 45px;
    height: 45px;
    background: #fff;
    padding: 3px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(0,0,0,0.05);
  }

  .cert-logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }

  .cert-main-info { flex-grow: 1; }

  .cert-item-title { 
    margin: 0; 
    font-size: 1.1rem; 
    color: var(--primary-text-color, #fff); 
    font-weight: 700;
  }

  .cert-item-org { 
    margin: 2px 0; 
    font-size: 0.95rem; 
    color: #3182ce; 
    font-weight: 600; 
  }

  .cert-item-meta { font-size: 0.8rem; color: #94a3b8; display: flex; gap: 12px; }

  .cert-verify-btn {
    font-size: 0.75rem;
    font-weight: 700;
    color: #3182ce !important;
    border: 1px solid #3182ce;
    padding: 4px 10px;
    border-radius: 4px;
    transition: all 0.2s;
  }

  .cert-item-container:hover .cert-verify-btn {
    background: #3182ce;
    color: #fff !important;
  }

  /* Varianta Education (Verde) */
  .dot-green { border-color: #48bb78 !important; }
  .dot-green i { color: #48bb78 !important; }
  .cert-item-container:hover .dot-green { 
    box-shadow: 0 0 0 0 rgba(72, 187, 120, 0.6);
    animation: cert-pulse-green 1.5s infinite cubic-bezier(0.66, 0, 0, 1);
  }
  @keyframes cert-pulse-green {
    to { box-shadow: 0 0 0 1rem rgba(72, 187, 120, 0); }
  }

  @media (max-width: 768px) {
    .cert-timeline-card { flex-direction: column; align-items: flex-start; gap: 1rem; }
    .cert-verify-btn { width: 100%; text-align: center; }
  }
</style>
