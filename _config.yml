# Minimal Mistakes settings
title: "Cătălin Creciunel"

email: "catalincreciunel@gmail.com"
description: >-
  Embedded Systems Engineer with a passion for PCB design, firmware, and automation.
baseurl: "" 
url: "https://creciunel.github.io" 

author: creciunel

# Set default author site-wide
defaults:
  - scope:
      path: ""
    values:
      layout: "single"
      author: creciunel

include:
  - robots.txt

remote_theme: "mmistakes/minimal-mistakes"
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-gist
  # - jekyll-archives
